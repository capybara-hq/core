<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话过程层次设计</title>
<style>
@font-face{font-family:"Sarasa Mono SC";font-weight:400;src:url("../../../packages/design/src/fonts/SarasaMonoSC-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"Sarasa Mono SC";font-weight:700;src:url("../../../packages/design/src/fonts/SarasaMonoSC-Bold.subset.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url("../../../packages/design/src/fonts/Inter-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:700;src:url("../../../packages/design/src/fonts/Inter-Bold.subset.woff2") format("woff2")}
@font-face{font-family:"Source Han Sans SC";font-weight:400;src:url("../../../packages/design/src/fonts/SourceHanSansSC-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"Source Han Sans SC";font-weight:700;src:url("../../../packages/design/src/fonts/SourceHanSansSC-Bold.subset.woff2") format("woff2")}

:root{
  --cb-font:"Sarasa Mono SC",ui-monospace,monospace;
  --cb-font-prose:"Inter","Source Han Sans SC",system-ui,sans-serif;
  --cb-font-code:"Sarasa Mono SC",ui-monospace,monospace;
  --cb-motion-hover:120ms;--cb-motion-expand:160ms;--cb-motion-spin:800ms;
  --cb-row-dense:28px;
  --cb-space-1:4px;--cb-space-2:8px;--cb-space-3:12px;--cb-space-4:16px;--cb-space-5:20px;--cb-space-6:24px;--cb-space-7:32px;
  --cb-radius-sm:4px;--cb-radius-md:8px;--cb-radius-bubble:10px;--cb-radius-pill:999px;
  --micro:11px/14px;--small:12px/16px;--body:13px/20px;--h2:16px/24px;--prose:15px/26px;--prose-small:13px/20px;
}
:root[data-theme="light"]{
  --cb-bg:#FAF9F6;--cb-panel:#FFFFFF;--cb-panel-2:#FCFBF9;--cb-raised:#FFFFFF;
  --cb-selected:rgba(26,26,24,0.07);--cb-hover:rgba(26,26,24,0.04);
  --cb-line-soft:#E8E7E2;--cb-line:#D9D8D2;--cb-line-strong:#B5B5AE;
  --cb-ink:#1A1A18;--cb-muted:#5E5E5A;--cb-faint:#9A9A94;
  --cb-accent:#CC4609;--cb-accent-tint:color-mix(in srgb,#CC4609 12%,transparent);
  --cb-ok:#16803F;--cb-fail:#C8302A;--cb-warn:#8F6500;
  --cb-shadow-1:0 2px 8px rgba(10,10,10,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --cb-bg:#0A0A0A;--cb-panel:#111110;--cb-panel-2:#0E0E0D;--cb-raised:#141413;
  --cb-selected:#1F1F1D;--cb-hover:#171716;
  --cb-line-soft:#1C1C1A;--cb-line:#2A2A28;--cb-line-strong:#3A3A37;
  --cb-ink:#E6E6E3;--cb-muted:#8E8E89;--cb-faint:#5A5A56;
  --cb-accent:#FF6A13;--cb-accent-tint:color-mix(in srgb,#FF6A13 12%,transparent);
  --cb-ok:#3FD483;--cb-fail:#FF5C52;--cb-warn:#F2C14B;
  --cb-shadow-1:0 8px 24px rgba(0,0,0,.40);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cb-bg);color:var(--cb-ink);font-family:var(--cb-font);font:var(--body) var(--cb-font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── page chrome ── */
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 20px;background:var(--cb-panel);border-bottom:1px solid var(--cb-line)}
.bar h1{margin:0;font:600 var(--body) var(--cb-font);margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--cb-line);border-radius:var(--cb-radius-sm);overflow:hidden}
.seg button{height:26px;padding:0 10px;font:var(--small) var(--cb-font);color:var(--cb-muted)}
.seg button+button{border-left:1px solid var(--cb-line)}
.seg button[aria-pressed="true"]{background:var(--cb-selected);color:var(--cb-ink);font-weight:600}
.lbl{font:var(--small) var(--cb-font);color:var(--cb-faint);margin-right:6px}
.stage{display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:20px}
.app{flex:0 1 860px;min-width:0;height:calc(100vh - 88px);min-height:560px;display:flex;flex-direction:column;border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-bg);overflow:hidden}
.titlebar{flex:none;height:48px;display:flex;align-items:center;gap:6px;padding:0 16px;font:var(--body) var(--cb-font)}
.titlebar .slash{color:var(--cb-faint)}
.thread{flex:1;overflow:auto}
.col{max-width:720px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:var(--cb-space-6)}
.composer-wrap{flex:none;padding:0 20px 12px}
.composer{max-width:720px;margin:0 auto;border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-raised);padding:10px 8px 8px 12px;box-shadow:var(--cb-shadow-1)}
.composer .ph{font:var(--prose) var(--cb-font-prose);color:var(--cb-faint);padding:2px 0 14px}
.composer .row{display:flex;align-items:center;gap:16px;font:var(--small) var(--cb-font);color:var(--cb-muted)}
.composer .row .sp{margin-left:auto}
.send{width:32px;height:32px;border-radius:var(--cb-radius-md);background:var(--cb-selected);display:grid;place-items:center;color:var(--cb-faint)}
.status{flex:none;height:24px;display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--cb-line-soft);font:var(--micro) var(--cb-font);color:var(--cb-muted)}
.status .r{margin-left:auto}
.notes{flex:0 0 380px;height:calc(100vh - 88px);min-height:560px;overflow:auto;border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-panel);padding:20px}
.notes h2{margin:0 0 8px;font:600 var(--h2) var(--cb-font-prose)}
.notes h3{margin:20px 0 6px;font:600 var(--body) var(--cb-font)}
.notes p,.notes li{font:var(--prose-small) var(--cb-font-prose);color:var(--cb-muted);margin:0 0 8px}
.notes ul{padding-left:18px;margin:0 0 8px}
.notes b{color:var(--cb-ink);font-weight:600}
.notes code{font:var(--small) var(--cb-font-code);color:var(--cb-ink)}
.notes .tag{display:inline-block;font:600 var(--micro) var(--cb-font);color:var(--cb-accent);background:var(--cb-accent-tint);border-radius:var(--cb-radius-sm);padding:1px 6px;margin-left:6px;vertical-align:1px}
.map{width:100%;border-collapse:collapse;margin:4px 0 8px}
.map td{padding:4px 6px 4px 0;border-bottom:1px solid var(--cb-line-soft);font:var(--small) var(--cb-font);color:var(--cb-muted);vertical-align:middle}
.map td:first-child{width:22px;color:var(--cb-muted)}
.map td.n{color:var(--cb-ink)}
.tiers{width:100%;border-collapse:collapse;margin:4px 0 8px}
.tiers td:first-child{white-space:nowrap;width:3em}
.tiers td{padding:6px 6px 6px 0;border-bottom:1px solid var(--cb-line-soft);font:var(--small) var(--cb-font);color:var(--cb-muted);vertical-align:top}
@media (max-width:1180px){.stage{flex-direction:column;align-items:stretch}.notes{flex:none;height:auto}}
@media (max-width:600px){.stage{padding:12px 0}.app{border-radius:0;border-left:0;border-right:0}.col{padding:12px 16px 32px}.composer-wrap{padding:0 16px 12px}.notes{border-radius:0}}

/* ── thread content ── */
.user{align-self:flex-end;max-width:75%;padding:6px 12px;border-radius:var(--cb-radius-bubble);background:var(--cb-selected);font:var(--prose) var(--cb-font-prose)}
.turn{display:flex;flex-direction:column;gap:var(--cb-space-5)}
.prose{font:var(--prose) var(--cb-font-prose);color:var(--cb-ink)}
.prose>*{margin:0}.prose>*+*{margin-top:12px}
.prose h4{font:600 var(--h2) var(--cb-font-prose);margin-top:20px}
.prose ul{padding-left:20px}
.prose strong{font-weight:600}
.prose code{font:var(--small) var(--cb-font-code);background:var(--cb-selected);border-radius:var(--cb-radius-sm);padding:1px 4px}
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:600px){.files{grid-template-columns:1fr}}
.fcard{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 12px;border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-raised);font:var(--small) var(--cb-font)}
.fcard .badge{flex:none;font:600 var(--micro) var(--cb-font);color:var(--cb-muted);border:1px solid var(--cb-line);border-radius:var(--cb-radius-sm);padding:1px 4px}
.fcard .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .sz{flex:none;color:var(--cb-faint)}
.fcard svg{color:var(--cb-faint)}

/* shared process primitives */
.spin{animation:spin var(--cb-motion-spin) linear infinite;color:var(--cb-accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.edot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cb-fail);vertical-align:1px}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* A · current (as shipped) */
.a-stack{display:flex;flex-direction:column;gap:var(--cb-space-3)}
.a-line{display:flex;align-items:center;gap:8px;min-height:28px;font:var(--body) var(--cb-font);color:var(--cb-muted);text-align:left;width:100%}
.a-line b{color:var(--cb-ink);font-weight:700}
.a-line .ell{flex:0 1 auto}
.a-box{background:var(--cb-panel);border-radius:var(--cb-radius-md);overflow:hidden}
.a-box .a-line{padding:6px 12px;font:var(--small) var(--cb-font)}
.a-box .a-line+.a-line{border-top:1px solid var(--cb-line-soft)}
.a-think{padding-left:12px;border-left:2px solid var(--cb-line);font:var(--prose) var(--cb-font-prose);color:var(--cb-muted);white-space:pre-wrap}

/* B / C · process line (lighter tier) */
.p{display:flex;align-items:center;gap:8px;min-height:var(--cb-row-dense);width:100%;padding:0 6px;margin:0 -6px;width:calc(100% + 12px);border-radius:var(--cb-radius-sm);font:var(--small) var(--cb-font);color:var(--cb-faint);text-align:left;transition:background-color var(--cb-motion-hover)}
button.p:hover{background:var(--cb-hover)}
button.p:hover .chev{color:var(--cb-muted)}
.p .ic{color:var(--cb-faint)}
.p .nm{flex:none;color:var(--cb-muted);font-weight:600}
.p .arg{flex:0 1 auto}
.p .meta{flex:none;white-space:nowrap}
.p .chev{flex:none;color:var(--cb-faint);transition:transform var(--cb-motion-expand)}
.p[aria-expanded="true"] .chev{transform:rotate(90deg)}
.p.live .nm,.p.live .arg{color:var(--cb-ink)}
.p .time{flex:none;margin-left:auto;color:var(--cb-faint);font-variant-numeric:tabular-nums}
.chips{display:flex;flex:none}
.chip{width:20px;height:20px;border-radius:var(--cb-radius-pill);background:var(--cb-panel);border:1px solid var(--cb-line-soft);display:grid;place-items:center;color:var(--cb-muted)}
.chip+.chip{margin-left:-5px}
.chip svg.i{width:11px;height:11px}
.b-stack{display:flex;flex-direction:column;gap:2px}
.b-box{margin:2px 0 4px;background:var(--cb-panel);border-radius:var(--cb-radius-md);padding:2px 12px}
.b-box .p{margin:0;width:100%;padding:0}
.b-box .row+.row{border-top:1px solid var(--cb-line-soft)}
.think-body{padding:2px 0 8px 22px;font:var(--prose-small) var(--cb-font-prose);color:var(--cb-muted);white-space:pre-wrap}
.detail{margin:2px 0 8px 22px;background:var(--cb-panel);border-radius:var(--cb-radius-md);padding:8px 12px;display:grid;grid-template-columns:4ch 1fr;gap:6px 8px;font:var(--small) var(--cb-font-code);color:var(--cb-muted)}
.detail .k{font:600 var(--micro) var(--cb-font);color:var(--cb-faint);padding-top:1px}
.detail pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
.say-b{font:var(--prose) var(--cb-font-prose);color:var(--cb-ink)}

/* C · merged process block with a rail */
.proc{display:flex;flex-direction:column}
.proc-head .sum{color:var(--cb-muted)}
.proc-head .sum b{font-weight:600;color:var(--cb-muted)}
.proc-head.live .sum{color:var(--cb-ink)}
.rail{position:relative;margin-top:4px}
.step{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:8px}
.step::before{content:"";position:absolute;left:9.5px;top:0;bottom:0;width:1px;background:var(--cb-line)}
.step:first-child::before{top:14px}
.step:last-child::before{bottom:calc(100% - 14px)}
.step .gut{height:28px;display:grid;place-items:center;position:relative;z-index:1}
.step .gut>span{display:grid;place-items:center;width:20px;height:20px;border-radius:var(--cb-radius-pill);background:var(--cb-bg);color:var(--cb-faint)}
.step .gut .dot{width:5px;height:5px;border-radius:50%;background:var(--cb-line-strong)}
.step .p{margin:0;width:100%;padding:0 6px 0 4px;margin-left:-4px;width:calc(100% + 4px)}
.step .say{padding:4px 0 6px;font:var(--prose-small) var(--cb-font-prose);color:var(--cb-muted)}
.step .think-body,.step .detail{margin-left:0;padding-left:0}
.step .detail{padding-left:12px}
.step.cur .gut>span{color:var(--cb-accent)}
.wait-card{margin-top:8px;border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-raised);padding:12px;display:flex;flex-direction:column;gap:8px}
.wait-card .t{font:600 var(--body) var(--cb-font)}
.wait-card .c{font:var(--small) var(--cb-font-code);color:var(--cb-muted);background:var(--cb-panel);border-radius:var(--cb-radius-sm);padding:6px 8px}
.wait-card .btns{display:flex;gap:8px;justify-content:flex-end}
.btn{height:28px;padding:0 12px;border-radius:var(--cb-radius-sm);border:1px solid var(--cb-line);font:var(--small) var(--cb-font)}
.btn.pri{background:var(--cb-accent);border-color:var(--cb-accent);color:#fff}
.accent{color:var(--cb-accent)}
.caption{font:var(--micro) var(--cb-font);color:var(--cb-faint);text-align:center;padding-top:4px}
.todo{margin:6px 0 2px 28px;padding:8px 12px;border-radius:var(--cb-radius-md);background:var(--cb-panel);display:flex;flex-direction:column;gap:2px}
.todo .h{display:flex;align-items:center;gap:8px;font:var(--micro) var(--cb-font);color:var(--cb-faint);padding-bottom:2px}
.todo ul{list-style:none;margin:0;padding:0}
.todo li{position:relative;padding-left:16px;font:var(--prose-small) var(--cb-font-prose);color:var(--cb-muted)}
.todo li[data-state="done"]{color:var(--cb-faint);text-decoration:line-through}
.todo li[data-state="current"]{color:var(--cb-ink)}
.todo li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;border:1px solid var(--cb-line-strong)}
.todo li[data-state="done"]::before{background:var(--cb-line-strong)}
.todo li[data-state="current"]::before{background:var(--cb-accent);border-color:var(--cb-accent)}
.acts{border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-raised);overflow:hidden}
.acts .hd{padding:8px 12px 4px;font:var(--micro) var(--cb-font);color:var(--cb-faint)}
.act{display:flex;align-items:center;gap:12px;padding:8px 12px}
.act+.act{border-top:1px solid var(--cb-line-soft)}
.act>svg{color:var(--cb-muted)}
.act .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.act .tt{font:600 var(--body) var(--cb-font);color:var(--cb-ink)}
.act .sb{font:var(--small) var(--cb-font);color:var(--cb-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-card{border:1px solid var(--cb-line);border-radius:var(--cb-radius-md);background:var(--cb-raised);padding:10px 12px;display:flex;align-items:center;gap:12px}
.ext{display:inline-flex;align-items:center;gap:4px}
/* ── IM (Feishu-like, neutral) ── */
.im-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.im-split{grid-template-columns:1fr}}
.im-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.im-col>.cap{font:600 var(--small) var(--cb-font);color:var(--cb-muted);padding-bottom:4px;border-bottom:1px solid var(--cb-line-soft)}
.im-col>.cap span{font-weight:400;color:var(--cb-faint)}
.im-chat{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:var(--cb-radius-md);background:var(--cb-panel-2);border:1px solid var(--cb-line-soft)}
.im-msg{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px}
.im-av{width:28px;height:28px;border-radius:var(--cb-radius-sm);display:grid;place-items:center;font:700 var(--small) var(--cb-font)}
.im-av.bot{background:var(--cb-avatar-capybara-ground, #FBE3D2);color:#8A4A1F}
.im-av.me{background:var(--cb-selected);color:var(--cb-muted)}
.im-who{font:var(--micro) var(--cb-font);color:var(--cb-faint);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.im-who{flex-wrap:wrap;row-gap:2px}
.im-who .bot-tag,.ping{white-space:nowrap}
.im-who .bot-tag{border:1px solid var(--cb-line);border-radius:3px;padding:0 3px}
.im-text{display:inline-block;max-width:100%;padding:7px 10px;border-radius:var(--cb-radius-md);background:var(--cb-raised);border:1px solid var(--cb-line-soft);font:var(--prose-small) var(--cb-font-prose);color:var(--cb-ink)}
.im-text ul{margin:4px 0 0;padding-left:18px}
.im-card{border-radius:var(--cb-radius-md);background:var(--cb-raised);border:1px solid var(--cb-line);overflow:hidden;font:var(--prose-small) var(--cb-font-prose);color:var(--cb-ink)}
.im-card .ch{padding:8px 12px;font-weight:600;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--cb-line-soft)}
.im-card .ch.run{background:var(--cb-accent-tint)}
.im-card .ch .r{margin-left:auto;font:400 var(--micro) var(--cb-font);color:var(--cb-faint)}
.im-card .cb{padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.im-card .sec{font:var(--micro) var(--cb-font);color:var(--cb-faint)}
.im-card .ln{font:var(--small) var(--cb-font);color:var(--cb-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-card .ln b{color:var(--cb-ink);font-weight:600}
.im-card .lk{color:var(--cb-accent);text-decoration:none;font:var(--small) var(--cb-font)}
.im-card .ft{padding:6px 12px;border-top:1px solid var(--cb-line-soft);display:flex;gap:8px;align-items:center;font:var(--small) var(--cb-font)}
.im-card .btns{display:flex;gap:8px;padding:0 12px 10px}
.im-card .todo{margin:0;padding:0;background:none}
.im-file{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--cb-radius-md);background:var(--cb-raised);border:1px solid var(--cb-line);font:var(--small) var(--cb-font)}
.im-file .ext{width:28px;height:32px;border-radius:3px;background:var(--cb-ok);color:#fff;display:grid;place-items:center;font:700 9px/1 var(--cb-font)}
.im-file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-file .z{color:var(--cb-faint)}
.ping{display:inline-flex;align-items:center;gap:4px;font:var(--micro) var(--cb-font);border-radius:3px;padding:0 4px}
.ping.new{color:var(--cb-accent);background:var(--cb-accent-tint)}
.ping.edit{color:var(--cb-muted);background:var(--cb-selected)}
.im-quiet{font:var(--micro) var(--cb-font);color:var(--cb-faint);text-align:center;padding:4px 0}
</style>
</head>
<body>
<div class="bar">
  <h1>对话过程：图标 · 合并 · 层次</h1>
  <span><span class="lbl">方案</span><span class="seg" id="v">
    <button data-v="A">现状</button><button data-v="B">一 · 图标+层次</button><button data-v="C">二 · 过程合并（推荐）</button><button data-v="IM">飞书适配</button>
  </span></span>
  <span><span class="lbl">状态</span><span class="seg" id="r">
    <button data-r="running">进行中</button><button data-r="waiting">等待批准</button><button data-r="done">已完成</button>
  </span></span>
  <span><span class="lbl">主题</span><span class="seg" id="t">
    <button data-t="light">亮</button><button data-t="dark">暗</button>
  </span></span>
</div>

<div class="stage">

    <li>手机：轨道 20 px 不变，头部单行省略，和现在的 touch 规则一致</li></ul>`,
};

document.getElementById("v").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.v = b.dataset.v; render(); } };
document.getElementById("r").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.r = b.dataset.r; S.open.delete("tail"); render(); } };
document.getElementById("t").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.t = b.dataset.t; render(); } };
// #v=C&r=running&t=dark&open=proc,s3 opens a given state directly
for (const [k, val] of new URLSearchParams(location.hash.slice(1))) {
  if (k === "open") val.split(",").forEach((x) => S.open.add(x));
  else if (k in S) S[k] = val;
}
render();
</script>
</body>
</html>
