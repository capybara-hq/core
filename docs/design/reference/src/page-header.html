<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Page header · reference</title>
<link rel="stylesheet" href="/design/styles/fonts.css">
<link rel="stylesheet" href="/design/styles/tokens.css">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<main class="r-page">
<h1>Page header</h1>
<p>Row 1: the path. Row 2: title and a one-line description, actions on the right (at most one solid primary). Below 640 (the narrow block, 390) the secondary actions fold into more, actions and tabs are 40 high, and the search takes its own line above the tabs, which scroll.</p>
<div class="r-blocks">
<section data-ref-block="page-header-title" style="width:var(--cb-layout-content)" data-pad>
  <template data-fixture="page-header" data-opts='{"title": "Agents"}'></template>
</section>
<section data-ref-block="page-header-path" style="width:var(--cb-layout-content)" data-pad>
  <template data-fixture="page-header" data-opts='{"path": true, "title": "编辑 Agent"}'></template>
</section>
<section data-ref-block="page-header-description-actions" style="width:var(--cb-layout-content)" data-pad>
  <template data-fixture="page-header" data-opts='{"description": true, "actions": true}'></template>
</section>
<section data-ref-block="page-header-long-title" style="width:640px" data-pad>
  <template data-fixture="page-header" data-opts='{"title": "季度经营分析与预算执行跟踪复盘助手的全部历史版本与发布记录以及每个版本的变更说明和审批意见汇总页面", "description": true, "actions": true}'></template>
</section>
<section data-ref-block="page-header-loading" style="width:var(--cb-layout-content)" data-pad>
  <template data-fixture="page-header" data-opts='{"loading": true}'></template>
</section>
<section data-ref-block="page-header-narrow-loading" style="width:390px" data-pad>
  <template data-fixture="page-header" data-opts='{"loading": true, "narrow": true}'></template>
</section>
<section data-ref-block="page-header-narrow" style="width:390px" data-pad>
  <template data-fixture="page-header" data-opts='{"title": "Agents", "actions": true, "narrow": true, "tabs": true}'></template>
</section>
</div>
</main>
<script src="fill.js"></script>
</body>
</html>
