<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Settings template · reference</title>
<link rel="stylesheet" href="/design/styles/fonts.css">
<link rel="stylesheet" href="/design/styles/tokens.css">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<main class="r-page">
<h1>Settings template</h1>
<p>Loading state (spec §5.8): the header keeps its rows, the sub-nav is real, each section draws a heading slot, a description slot and field placeholders, the action row stays with disabled buttons. Nothing animates.</p>
<div class="r-blocks">
<section data-ref-block="template-settings-loading" style="width:1280px;height:640px">
  <div class="r-tpl" aria-busy="true">
    <div class="r-tpl-head"><template data-fixture="page-header" data-opts='{"loading": {"actions": 0, "tabs": 0}}'></template></div>
    <div class="r-tpl-body r-tpl-form"><div class="r-set-grid"><nav class="r-set-nav" data-part="settings-nav" aria-label="设置导航"><div class="r-set-section"><span class="r-set-group">组织</span><a class="r-set-item" data-current="true" href="#"><span>组织</span></a><a class="r-set-item" href="#"><span>环境</span></a><a class="r-set-item" href="#"><span>成员</span><span class="r-set-count">5</span></a></div><div class="r-set-section"><span class="r-set-group">计费</span><a class="r-set-item" href="#"><span>计费</span></a></div></nav><div class="r-set-content"><section class="r-form-section"><div class="r-form-intro"><div class="r-skel-text" data-part="skeleton-text" data-size="heading" style="width:45%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div><div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:70%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div></div><div class="r-form-card"><div class="r-field" data-part="loading-field"><div class="r-field-head"><div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:30%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div></div><div class="r-skel-box" data-part="skeleton-box" data-box="default"></div></div><div class="r-field" data-part="loading-field"><div class="r-field-head"><div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:30%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div></div><div class="r-skel-box" data-part="skeleton-box" data-box="default"></div></div></div></section><section class="r-form-section"><div class="r-form-intro"><div class="r-skel-text" data-part="skeleton-text" data-size="heading" style="width:45%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div><div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:70%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div></div><div class="r-form-card"><div class="r-field" data-part="loading-field"><div class="r-field-head"><div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:30%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div></div><div class="r-skel-box" data-part="skeleton-box" data-box="default"></div></div></div></section></div></div></div>
    <div class="r-actionrow"><span class="r-actionrow-text"></span><button class="r-btn" data-variant="default" disabled>取消</button><button class="r-btn" data-variant="primary" disabled>保存</button></div>
  </div>
</section>
</div>
</main>
<script src="fill.js"></script>
</body>
</html>
