<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Skeleton · reference</title>
<link rel="stylesheet" href="/design/styles/fonts.css">
<link rel="stylesheet" href="/design/styles/tokens.css">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<main class="r-page">
<h1>Skeleton</h1>
<p>The placeholder primitives of every loading state (spec §6.29): text bars at the line box of their type size on the hover ground, control-sized blocks on the selected ground, and a busy group. Nothing animates.</p>
<div class="r-blocks">
<section data-ref-block="skeleton-text" style="width:400px" data-pad>
  <div class="r-skel-stack">
    <div class="r-skel-text" data-part="skeleton-text" data-size="title" style="width:30%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div>
    <div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:55%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div>
    <div class="r-skel-text" data-part="skeleton-text" data-size="small" style="width:70%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div>
    <div class="r-skel-text" data-part="skeleton-text" data-size="prose" style="width:100%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div>
  </div>
</section>
<section data-ref-block="skeleton-box" style="width:400px" data-pad>
  <div class="r-skel-stack">
    <div class="r-skel-box" data-part="skeleton-box" data-box="dense" style="width:96px"></div>
    <div class="r-skel-box" data-part="skeleton-box" data-box="default" style="width:96px"></div>
    <div class="r-skel-box" data-part="skeleton-box" data-box="prominent" style="width:96px"></div>
    <div class="r-skel-box" data-part="skeleton-box" data-box="mark"></div>
  </div>
</section>
<section data-ref-block="skeleton-group" style="width:400px" data-pad>
  <div class="r-skel-stack" aria-busy="true">
    <div class="r-skel-text" data-part="skeleton-text" data-size="body" style="width:55%"><span class="r-skel-bar" data-part="skeleton-bar"></span></div>
    <div class="r-skel-box" data-part="skeleton-box" data-box="default" style="width:96px"></div>
  </div>
</section>
</div>
</main>
<script src="fill.js"></script>
</body>
</html>
