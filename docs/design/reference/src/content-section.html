<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>ContentSection · reference</title>
<link rel="stylesheet" href="/design/styles/fonts.css">
<link rel="stylesheet" href="/design/styles/tokens.css">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<main class="r-page">
<h1>ContentSection</h1>
<p>One section of a detail page's single column or a review: a heading in the h2 step over its content; help and empty lines small and muted (spec §6.31).</p>
<div class="r-blocks">
<section data-ref-block="content-section-default" style="width:720px" data-pad>
  <section class="r-content-section" data-part="content-section">
    <div class="r-content-section-head"><h2 class="r-content-section-title" data-part="content-section-title">技能</h2><span class="r-content-section-count" data-part="content-section-count">2</span></div>
    <p class="r-content-section-description" data-part="content-section-description">插件自带的技能，随插件启用。</p>
    <span>· pdf-tools</span>
    <span>· meeting-notes</span>
  </section>
</section>
<section data-ref-block="content-section-empty" style="width:720px" data-pad>
  <section class="r-content-section" data-part="content-section">
    <div class="r-content-section-head"><h2 class="r-content-section-title" data-part="content-section-title">扩展</h2></div>
    <p class="r-content-section-empty" data-part="content-section-empty">没有扩展。</p>
  </section>
</section>
</div>
</main>
<script src="fill.js"></script>
</body>
</html>
