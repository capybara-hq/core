<main class="r-page">
<h1>Diff block</h1>
<p>Line numbers in a 4-character gutter; added and removed lines by tinted ground only (diff-add / diff-del); a capped diff ends with a truncation line.</p>
<div class="r-blocks">
<section data-ref-block="diff-block-default" style="width:752px" data-pad>
  <template data-fixture="diff-block" data-opts='{"state": "default"}'></template>
</section>
<section data-ref-block="diff-block-truncated" style="width:752px" data-pad>
  <template data-fixture="diff-block" data-opts='{"state": "truncated"}'></template>
</section>
</div>
</main>
