<main class="r-page">
<h1>Sub-agent group</h1>
<p>Like tool groups: a summary line over one Agent call block per sub-agent (header Agent + task, IN with the prompt in two lines, then a status line: the dot, "后台运行中：&lt;current tool&gt;" or the final state, and "在智能体图中查看").</p>
<div class="r-blocks">
<section data-ref-block="subagent-group-running" style="width:752px" data-pad>
  <template data-fixture="subagent-group" data-opts='{"state": "running"}'></template>
</section>
<section data-ref-block="subagent-group-waiting" style="width:752px" data-pad>
  <template data-fixture="subagent-group" data-opts='{"state": "waiting"}'></template>
</section>

</section>

</section>
<section data-ref-block="subagent-group-expanded" style="width:752px" data-pad>
