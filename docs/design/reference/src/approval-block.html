<main class="r-page">
<h1>Approval block</h1>

<div class="r-blocks">
<section data-ref-block="approval-block-pending" style="width:752px" data-pad>
  <template data-fixture="approval-block" data-opts='{"state": "pending"}'></template>
</section>
<section data-ref-block="approval-block-pending-once" style="width:752px" data-pad>

</section>
<section data-ref-block="approval-block-denied" style="width:752px" data-pad>

</section>
