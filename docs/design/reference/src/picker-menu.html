<main class="r-page">
<h1>Picker menus</h1>
<p>Menus above the composer: models grouped by provider with the agent's model first; the efforts the model declares; agents (new conversation only). Changes apply from the next message.</p>
<div class="r-blocks">
<section data-ref-block="picker-menu-model" style="width:752px" data-pad>
  <template data-fixture="picker-menu" data-opts='{"state": "model"}'></template>
</section>
<section data-ref-block="picker-menu-effort" style="width:752px" data-pad>
  <template data-fixture="picker-menu" data-opts='{"state": "effort"}'></template>
</section>
<section data-ref-block="picker-menu-agent" style="width:752px" data-pad>
  <template data-fixture="picker-menu" data-opts='{"state": "agent"}'></template>
</section>
</div>
</main>

<script src="fill.js"></script>
