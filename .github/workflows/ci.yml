name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions: each job asks for what it needs (only `contents: read` to check out;
# artifacts and the Actions cache use the runner's own token, not GITHUB_TOKEN).
permissions: {}

# Branch protection requires `ci-ok` (which aggregates every job below) and `issue-linked`
# (set by community.yml, not part of this workflow).
#
# PRs run what the diff affects; pushes to main run everything. The plan comes from
# tools/ci/src/affected.ts (rules and their tests live there; AGENTS.md "CI and checks" lists them):
# - ci (lint, typecheck, pnpm check, plugin packing, commitlint): always, in full (pnpm check runs
#   the plugin-scoped checks of packages/plugin-tools, the code behind `capybara-plugin check`, on
#   model-fake and the fake extensions (the official plugins live in capybara-hq/plugins), and
#   includes perm-hooks: cheap, reads all plugin sources;
#   check:sdk-api: cheap, regenerates the plugin SDK API report; check:skills-frontmatter: cheap,
#   reads the skills' frontmatter; check:compose-haproxy: cheap, compares two files
#   (compose.yaml's inline config and docker/sandbox-proxy/haproxy.cfg);
#   check:test-plugins: cheap, a text scan of the test roots (incl. test-plugins-official: core
#   tests load only model-fake, OFFICIAL_EXCEPTIONS is empty, and test-plugins-stale-exception: an
#   exception that no longer loads its plugins fails); plugin-test-imports (plugin tests reach
#   nothing outside their plugin) and plugin-release-metadata (published plugins name the root
#   package.json's repository; example-* private), both plugin-tools checks: cheap, scan the
#   plugin tests and read the plugins' package.json files; check:release-metadata: cheap, reads
#   the workspace package.json files and the compose image tag; check:terms: cheap, a text scan of the tracked files for the old extension /
#   catalog / plugin names; check:kernel-conventions: cheap, parses the kernel source, its tests
#   and its callers (about a second) for the patterns the Nest refactor removed; and check:bootstrap: cheap offline (the manifest parses; its npm pins
#   are left to the network half; bootstrap-compose-ref: the compose files' git build contexts of
#   capybara-hq/plugins are pinned to marketplace.commit), in full; check:tokens: cheap, compares
#   docs/design/tokens.json with the two files gen:tokens renders from it and checks its contrast
#   pairs; design-char-icon, a rule of check:web-ui: cheap, a text scan for characters used as icons in apps/web and
#   packages/design). Its network half (`check:bootstrap --network`: npm entries
#   against the registry and the official marketplace commit, marketplace.url the official one,
#   bootstrap-haproxy: the sandbox-docker plugin's test copy of the socket proxy config at that
#   commit equals docker/sandbox-proxy/haproxy.cfg, and the compose build contexts exist there;
#   needs GitHub and npm) runs in the ci job by diff on PRs, only when one of its inputs changed
#   (packages/kernel/bootstrap.json, the check's code tools/checks/src/{bootstrap*,cli/bootstrap}.ts,
#   packages/plugin-tools/src/pack/npm.ts, packages/plugin-sdk/src/bootstrap.ts; docker/** runs
#   everything anyway; plan output bootstrap-network), always on main and in release.yml. On PRs the ci job also runs
#   check:sdk-api-changeset and check:applied-migrations, in full (cheap inspections of the PR diff;
#   skipped on main, which has no base to compare);
# npm publishing and the image push are not here: .github/workflows/release.yml runs on push to
# main and workflow_dispatch only, never on PRs.
# - test: the affected workspace packages only (4 shards when the kernel tests run, else 1), plus
#   apps/capybara when packages/kernel/bootstrap.json or packages/plugin-tools changed (its tests
#   pack fakes and bootstrap them); core tests load model-fake and the fakes only;
# - web, visual: when apps/web or packages/design changed, or docs/design/{spec.md,tokens.json}
#   (EXTRA_INPUTS); visual runs the screenshot regression plus the measuring / state-coverage /
#   completeness spec (visual/fidelity.spec.ts) and the interaction specs
#   (visual/*.interaction.spec.ts); by diff because it builds Next and runs Playwright (minutes);
#   the reference images (reference-update.yml) and the baselines (visual-update.yml) are rendered
#   only by those manual workflows, never on PRs;
# - e2e: when anything the e2e stack is built from or loads changed (including
#   packages/kernel/bootstrap.json, whose npm pins the e2e setup's `capybara bootstrap` downloads
#   and installs);
# - docker (builds the four images for linux/amd64, never pushes, runs docker/test/compose-smoke.sh;
#   ~15 min, so by diff): when anything the images are built from changed (the dependency closure of
#   apps/capybara and apps/web: kernel, plugin-sdk, design; packages/kernel/bootstrap.json, whose
#   npm pins the compose init downloads), plugins/model-fake or packages/plugin-tools (the smoke
#   test packs model-fake with it and installs it);
#   docker/**, the Dockerfiles and .dockerignore are outside every package, so they run everything;
# - docs-only diffs skip test / web / e2e / visual / docker; root config, the lockfile, .github/**, tools/ci/**,
#   packages/testing/**, unknown files, or a diff that can't be computed run everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test: ${{ steps.plan.outputs.test }}
      test-dirs: ${{ steps.plan.outputs.test-dirs }}
      test-shards: ${{ steps.plan.outputs.test-shards }}
      test-shard-total: ${{ steps.plan.outputs.test-shard-total }}
      web: ${{ steps.plan.outputs.web }}
      visual: ${{ steps.plan.outputs.visual }}
      e2e: ${{ steps.plan.outputs.e2e }}
      docker: ${{ steps.plan.outputs.docker }}
      bootstrap-network: ${{ steps.plan.outputs.bootstrap-network }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The plan script is plain erasable TypeScript run by node 24; no pnpm install needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # When in doubt, run everything: a missed run is worse than a wasted one.
          if [ "$EVENT" != "pull_request" ]; then
            node tools/ci/src/cli.ts --all "push to main"
          elif ! git diff --name-only "$BASE...$HEAD_SHA" > changed-files.txt; then
            node tools/ci/src/cli.ts --all "could not diff $BASE...$HEAD_SHA"
          elif grep -qE '^(\.github/|tools/ci/)' changed-files.txt; then
            # Decided here, not by the script: the PR may have changed the script itself.
            cat changed-files.txt
            node tools/ci/src/cli.ts --all "CI definition changed (.github/** or tools/ci/**)"
          else
            cat changed-files.txt
            node tools/ci/src/cli.ts < changed-files.txt
          fi

  # Cheap or whole-repo checks and build artifacts: always run in full. Tests are in the test job.
  ci:
    # needs the plan only for the network half of check:bootstrap below
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every custom check, in full on PRs (all cheap), including check:release-metadata
      # (published packages carry the repository npm provenance needs; F2 packages stay private)
      # and check:bootstrap (offline: the manifest and the compose files' pinned git contexts).
      - run: pnpm check
      # A change to the plugin SDK API report needs a changeset bumping @capybara-hq/plugin-sdk.
      # The checkout is the PR merge commit; its first parent is the base branch as merged, while
      # pull_request.base.sha goes stale once main moves on.
      - name: SDK API changeset
        if: github.event_name == 'pull_request'
        run: pnpm check:sdk-api-changeset --base "$(git rev-parse HEAD^1)"
      # Applied migrations are immutable: the diff may add migration files but not modify, delete or
      # rename existing ones (kernel and plugin migrations). Same base as above.
      - name: Applied migrations
        if: github.event_name == 'pull_request'
        run: pnpm check:applied-migrations --base "$(git rev-parse HEAD^1)"
      # The network half of check:bootstrap: bootstrap.json's npm entries are published with their
      # pinned sha512 and listed at the same version and integrity in the official marketplace at
      # `marketplace.commit` (which must be the official URL); there, the sandbox-docker plugin's
      # copy of the socket proxy config equals ours and the compose build contexts exist. Needs
      # GitHub and npm, so by diff on PRs (only when one of its inputs changed: bootstrap.json, the
      # check's code, the npm fetcher; docker/** runs everything), always on main and in release.yml.
      - name: Bootstrap manifest against npm and the marketplace
        if: needs.changes.outputs.bootstrap-network == 'true'
        run: pnpm check:bootstrap --network
      # model-fake (published from core) and the fake extensions of @capybara-hq/testing; the
      # official plugins are packed and published by capybara-hq/plugins.
      - name: Pack model-fake and the fake extensions
        run: pnpm pack-plugins packages/testing/fixtures/extensions/* --out artifacts/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: artifacts/plugins/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # vitest by file, sharded (the full suite takes ~18 min on a 2-core runner); each shard starts its own
  # Testcontainers. On PRs only the affected package directories run (test-dirs, empty = everything).
  test:
    name: test (${{ matrix.shard }}/${{ needs.changes.outputs.test-shard-total }})
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.changes.outputs.test-shard-total }}
          DIRS: ${{ needs.changes.outputs.test-dirs }}
        run: |
          echo "test dirs: ${DIRS:-<all>}"
          # Word splitting of DIRS is intended: space-separated directories, none of them with spaces.
          # shellcheck disable=SC2086
          pnpm exec vitest run --passWithNoTests --shard="$SHARD/$TOTAL" $DIRS

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capybara-hq/web build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured locally, the e2e run itself takes about 10s (including Testcontainers startup); CI also
    # needs dependency install, Playwright and image pulls. Chromium is cached under
    # ~/.cache/ms-playwright by the @playwright/test version in the lockfile; on a hit only the system
    # dependencies are installed (install-deps still goes through apt). With a slow apt mirror that alone
    # can take several minutes (run 39890548962 was cancelled at the 10 minute mark although the tests
    # had all passed), hence the 20 minute limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (with system dependencies)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @capybara-hq/web exec playwright install --with-deps chromium
      - name: Install only the Chromium system dependencies (the browser comes from the cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @capybara-hq/web exec playwright install-deps chromium
      - name: End-to-end tests (Testcontainers starts PG / Valkey, kernel + model-fake, web tier)
        run: pnpm --filter @capybara-hq/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e-logs
          retention-days: 7

  visual:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Baseline screenshots are generated and compared only in this image (the version matches
    # @playwright/test in apps/web; change both together when upgrading).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Screenshot regression (/dev/ui catalog page)
        run: pnpm --filter @capybara-hq/web visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The release images, built for linux/amd64 only (the runner's platform), loaded into the runner's
  # Docker and never pushed; then the compose smoke test runs against them (docker/compose.yaml from
  # scratch, see the script header). arm64 is built only by the release (release.yml, native runners).
  # Layers come from the GitHub Actions cache; only pushes to main write it (the scopes release.yml
  # reads too), so PR runs don't evict it.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      CACHE_TO: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # compose-smoke.sh packs plugins/model-fake with `pnpm pack-plugin`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The three kernel images share every layer but the last; the builder keeps them between steps.
      - name: Build capybara-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/kernel.Dockerfile
          platforms: linux/amd64
          build-args: ROLES=api
          load: true
          provenance: false
          tags: capybara-api:test
          cache-from: type=gha,scope=kernel-amd64
          cache-to: ${{ env.CACHE_TO != '' && format('{0},scope=kernel-amd64', env.CACHE_TO) || '' }}
      - name: Build capybara-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/kernel.Dockerfile
          platforms: linux/amd64
          build-args: ROLES=worker
          load: true
          provenance: false
          tags: capybara-worker:test
          cache-from: type=gha,scope=kernel-amd64
      - name: Build capybara-gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/kernel.Dockerfile
          platforms: linux/amd64
          build-args: ROLES=gateway
          load: true
          provenance: false
          tags: capybara-gateway:test
          cache-from: type=gha,scope=kernel-amd64
      - name: Build capybara-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: capybara-web:test
          cache-from: type=gha,scope=web-amd64
          cache-to: ${{ env.CACHE_TO != '' && format('{0},scope=web-amd64', env.CACHE_TO) || '' }}
      - name: Compose smoke test
        env:
          SKIP_BUILD: "1"
        run: docker/test/compose-smoke.sh

  # Aggregate: the only required check. changes and ci must succeed; every other job must succeed
  # when the plan says it runs, and may be skipped only when the plan says it doesn't. always():
  # report failure when an upstream job failed instead of being skipped (skipped = passed).
  ci-ok:
    if: always()
    needs: [changes, ci, test, web, e2e, visual, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CI_JOB: ${{ needs.ci.result }}
          TEST: ${{ needs.changes.outputs.test }}:${{ needs.test.result }}
          WEB: ${{ needs.changes.outputs.web }}:${{ needs.web.result }}
          E2E: ${{ needs.changes.outputs.e2e }}:${{ needs.e2e.result }}
          VISUAL: ${{ needs.changes.outputs.visual }}:${{ needs.visual.result }}
          DOCKER: ${{ needs.changes.outputs.docker }}:${{ needs.docker.result }}
        run: |
          # Each job is "<planned>:<result>".
          echo "changes=$CHANGES ci=$CI_JOB test=$TEST web=$WEB e2e=$E2E visual=$VISUAL docker=$DOCKER"
          fail=0
          [ "$CHANGES" = "success" ] || fail=1
          [ "$CI_JOB" = "success" ] || fail=1
          for r in "$TEST" "$WEB" "$E2E" "$VISUAL" "$DOCKER"; do
            case "$r" in
              true:success | false:success | false:skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"
