name: Update visual baselines

# Manual trigger: regenerates the /dev/ui screenshot baselines in the same Playwright image as CI and commits them back to the given branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-update-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate screenshot baselines
        run: pnpm --filter @capybara-hq/web visual:update
      - name: Commit and push
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "Grant"
          git config user.email "284885069@qq.com"
          git add apps/web/visual
          if git diff --cached --quiet; then
            echo "No screenshot baseline changes"
            exit 0
          fi
          git commit -m "test(web): update screenshot baselines"
          git push origin "HEAD:refs/heads/$BRANCH"
