name: capybara-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: capybara
      POSTGRES_PASSWORD: capybara
      POSTGRES_DB: capybara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

volumes:
  pgdata:
